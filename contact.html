<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Jo's Bakery | Location & Hours Pretoria</title>
<meta name="description" content="Contact Jo's Bakery in Pretoria - find us, hours, send a general message.">
<meta name="keywords" content="bakery Pretoria, contact Jo's Bakery, location">
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
</head>
<body>
<header>
  <img src="images/jo-bakery-logo.jpg" alt="Jo's Bakery Logo - Fresh Baked Goods Pretoria" width="120">
  <button class="menu-toggle" onclick="document.querySelector('nav ul').classList.toggle('active')">☰</button>
  <nav>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="services.html">Services</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="enquiries.html">Enquiries</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>
</header>

<main>
  <section class="content">
    <h1>Contact Us</h1>
    <h2>Send Us a General Message</h2>
    
    <div class="card">
      <form id="contactForm" action="https://formspree.io/f/mldbyqko" method="POST">
        <label for="name">Full Name:</label><br>
        <input type="text" id="name" name="name" required minlength="3" placeholder="Your name"><br><br>

        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" required placeholder="you@example.com"><br><br>

        <label for="type">Type of Message:</label><br>
        <select id="type" name="messageType" required>
          <option value="">-- Select --</option>
          <option value="general">General Enquiry</option>
          <option value="feedback">Feedback</option>
          <option value="complaint">Complaint</option>
        </select><br><br>

        <label for="message">Full Message:</label><br>
        <textarea id="message" name="message" rows="5" required minlength="20" placeholder="Type your message..."></textarea><br><br>

        <button type="submit" class="btn">Send Email</button>
        <button type="reset" class="btn" style="background:#999;">Clear</button>
        <p id="formError" style="color:red; margin-top:1rem;"></p>
        <p id="contactMsg" style="color:green;"></p>
      </form>
    </div>

    <h2>Find Us</h2>
    <div id="map" style="height:350px; border-radius:12px; margin-top:1rem;"></div>
  </section>

  <aside class="sidebar card">
    <h3>Jo's Bakery</h3>
    <p><strong>Address:</strong> 123 Main Rd, Pretoria</p>
    <p><strong>Hours:</strong> Mon-Sat 7am-6pm</p>
    <p><strong>Phone:</strong> 012 345 6789</p>
  </aside>
</main>

<footer>
  <p>&copy; 2026 Jo's Bakery. All rights reserved. | <a href="sitemap.xml" style="color:white;">Sitemap</a></p>
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="script.js"></script>
<script>
  // Map init for contact page
  var map = L.map('map').setView([-25.7479, 28.2293], 14);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
  L.marker([-25.7479, 28.2293]).addTo(map).bindPopup("Jo's Bakery - Pretoria");
</script>
</body>
</html>
