<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enquiries - Jo's Bakery</title>
</head>

<body>

    <header>

        <img src="images/Jo's Bakery Logo.jpg" alt="Jo's Bakery Logo">

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="enquiries.html">Enquiries</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>

    </header>

    <main>

        <h1>Make an Enquiry</h1>

        <p>
            Welcome to Jo's Bakery. Please complete the form below
            if you have any questions about our products and services.
        </p>

        <form>

            <label for="name">Full Name:</label><br>
            <input type="text" id="name" name="name" required>
            <br><br>

            <label for="email">Email Address:</label><br>
            <input type="email" id="email" name="email" required>
            <br><br>

            <label for="phone">Phone Number:</label><br>
            <input type="tel" id="phone" name="phone">
            <br><br>

            <label for="enquiry">Your Enquiry:</label><br>
            <textarea id="enquiry" name="enquiry" rows="5" cols="30"
                required></textarea>
            <br><br>

            <button type="submit">Submit Enquiry</button>
            <button type="reset">Clear</button>

        </form>

    </main>

    <footer>

        <p>&copy; 2026 Jo's Bakery. All rights reserved.</p>

    </footer>

</body>

</html>
